name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t exposeguard:ci .

      - name: Smoke test container
        run: |
          docker run -d --name exposeguard -p 3000:3000 exposeguard:ci
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' exposeguard)
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          docker ps
          curl -fsS http://localhost:3000/api/health
          curl -fsS -o /dev/null http://localhost:3000/
          curl -fsS -o /dev/null http://localhost:3000/eglogo.png
          [ "$(docker inspect --format '{{.State.Health.Status}}' exposeguard)" = "healthy" ]

      - name: Container logs
        if: failure()
        run: docker logs exposeguard
